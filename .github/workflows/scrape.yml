name: Scrape jobs
permissions:
  contents: write

on:
  push:
    paths:
      - ".github/workflows/scrape.yml"
  schedule:
    - cron: "3 8 * * *"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run scraper
        env:
          CI: true
        run: node scripts/scrape.js
      - name: Commit data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json || true
          if git diff --quiet --cached; then
            echo "No changes to commit"
          else
            git commit -m "Update scraped jobs.json [skip ci]" -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>" || echo "commit failed"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          fi
