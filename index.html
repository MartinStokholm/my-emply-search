<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Emply Job Search - Aarhus</title>
  <link rel="stylesheet" href="assets/style.css">
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
</head>
<body>
  <div id="app">
    <h1>Job Search - Aarhus</h1>
    <div class="controls">
      <input v-model="query" placeholder="Filter by words (space-separated)" />

      <div class="field-controls">
        <label><input type="checkbox" v-model="searchFields.title" /> Title</label>
        <label><input type="checkbox" v-model="searchFields.location" /> Location</label>
        <label><input type="checkbox" v-model="searchFields.content" /> Content</label>
      </div>

      <div class="tag-controls">
        <button @click="addTag" class="tag-add" :disabled="!query.trim()">Save search</button>
        <button @click="clearSaved" class="tag-clear" v-if="savedTags.length">Clear saved</button>
      </div>

      <div class="active-filters" v-if="activeWords.length">
        Active filters:
        <span class="active-word" v-for="w in activeWords" :key="w">{{w}}</span>
      </div>

      <label style="display:block;margin-top:8px"><input type="checkbox" v-model="showReasons" /> Show match reasons</label>

      <div class="saved-tags" v-if="savedTags.length">
        <span class="tag" 
              v-for="(t, idx) in savedTags" 
              :key="t.text" 
              :class="{active: t.active}"
              @click="toggleTag(idx)">
          {{t.text}}
        </span>
      </div>
    </div>
    <div v-if="loading">Loading jobs...</div>
    <div v-else>
      <div v-if="filtered.length===0">No jobs found.</div>
      <ul>
        <li v-for="job in filtered" :key="job && job.id">
          <template v-if="job">
            <a :href="job.url || '#'" target="_blank" rel="noopener">{{job.title || '(no title)'}} </a>
            <div class="meta">{{job.location || ''}}</div>
            <div class="match-reasons" v-if="showReasons">
              <span v-for="m in getMatchInfo(job)" :key="m.word">{{m.word}}: {{m.fields.join(', ')}}</span>
            </div>
          </template>
        </li>
      </ul>
    </div>
    <p class="note">Data refreshed by GitHub Actions scraper; if empty, run the workflow or check the action logs.</p>
  </div>
  <script src="assets/app.js"></script>
</body>
</html>
